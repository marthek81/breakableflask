name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependances
        run: |
          docker run --rm -v ${{ github.workspace }}:/project aquasec/trivy:latest fs /project/requirements.txt
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - uses: actions/checkout@v4
      - name: Test Dockerfile
        run: |
          docker run --rm -v ${{ github.workspace }}:/project aquasec/trivy:latest config /project/Dockerfile
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"